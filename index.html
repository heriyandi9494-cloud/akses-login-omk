<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>DATA OMK SEKONAU</title>

  <!-- FULLSCREEN MOBILE SETTING -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      background-image: url("https://i.postimg.cc/RVjmS6X6/articles-My-Gsv-MX-news-g5hoqxs-Santo-Petrus-dan-Santo-Paulus-Rasul-001-removebg-preview.png");
    }

    body {
      height: 100dvh; /* Fullscreen Real */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url("https://i.postimg.cc/RVjmS6X6/articles-My-Gsv-MX-news-g5hoqxs-Santo-Petrus-dan-Santo-Paulus-Rasul-001-removebg-preview.png");
    }


    /* ===== LOGIN BOX PREMIUM GLASS DARK ===== */
    .login-box {
      width: 90%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.07);
      padding: 30px;
      border-radius: 18px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 0 30px rgba(0, 200, 255, 0.25),
                  inset 0 0 20px rgba(255, 255, 255, 0.05);
      text-align: center;
      color: #fff;
      animation: fadeIn 0.9s ease;
      border: 1px solid rgba(255,255,255,0.08);
    }

    h2 {
      margin-bottom: 18px;
      font-weight: 700;
      color: #4fc3f7;
      text-shadow: 0 0 10px #00eaff;
    }

    p {
      font-size: 14px;
      color: #0414f3;
      margin-bottom: 10px;
    }

    /* ===== INPUT DARK GLASS ===== */
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 15px;
      background: rgba(201, 7, 7, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 8px rgba(220, 9, 9, 0.15);
      color: #f30f0f;
    }

    input::placeholder {
      color: #78b0ff;
    }

    /* ===== TOMBOL PREMIUM NEON ===== */
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00eaff, #0066ff);
      color: #000;
      font-size: 17px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 20px #00eaff;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px #0099ff, 0 0 50px #00eaff;
    }

    a {
      color: #1ea7ff;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-shadow: 0 0 8px #00eaff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- LOGIN GLASS -->
<div class="login-box">
  <h2>𝐋𝐎𝐆𝐈𝐍</h2>
  <p>𝐃𝐀𝐅𝐓𝐀𝐑𝐊𝐀𝐍 𝐍𝐀𝐌𝐀 𝐀𝐍𝐃𝐀 𝐃𝐈𝐒𝐈𝐍𝐈</p>

  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p style="margin-top:15px;">
    𝐈𝐧𝐠𝐢𝐧 𝐥𝐢𝐡𝐚𝐭 𝐝𝐚𝐭𝐚 𝐚𝐧𝐝𝐚 𝐝𝐢 𝐬𝐢𝐧𝐢?  
    <a href="https://heriyandi9494-cloud.github.io/wa-saya/">Klik disini</a>
  </p>
</div>

<!-- FIREBASE AUTH -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCWKrvRXSsefKayAudgkAwB1x9DFiakh3Q",
    authDomain: "akses-omk.firebaseapp.com",
    projectId: "akses-omk",
    storageBucket: "akses-omk.firebasestorage.app",
    messagingSenderId: "458484845426",
    appId: "1:458484845426:web:6e1398296a7f6167626beb",
    measurementId: "G-QEJETZ4C53"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.login = function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = "https://heriyandi9494-cloud.github.io/omksekonau/";
      })
      .catch((error) => {
        alert("Login gagal: " + error.message);
      });
  };
</script>

</body>
</html>
